<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All of it, in order</title>
<style>
  body {
    font: 21px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: #111; background: #fbfaf8;
    max-width: 34em; margin: 0 auto; padding: 28px 20px;
  }
  h1 { font-size: 34px; line-height: 1.25; }
</style>
</head>
<body>
<main><h1 id="m">Getting the page&hellip;</h1></main>
<script>
(async () => {
  const m = document.getElementById("m");
  const k = new URLSearchParams(location.search).get("k");
  if (!k) { m.textContent = "This page needs its key. Check the bookmark."; return; }
  try {
    const r = await fetch(
      "https://kwirafdwfffpbtycmctx.supabase.co/functions/v1/window?k=" + encodeURIComponent(k)
    );
    const html = await r.text();
    if (!r.ok) { m.textContent = "The window said no. Check the key in the bookmark."; return; }
    document.open(); document.write(html); document.close();
  } catch {
    m.textContent = "Couldn't reach the window. Try again in a minute.";
  }
})();
</script>
</body>
</html>
