<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Coffee</title>
<style>
  body {
    font: 21px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: #14120e; background: #faf8f4;
    max-width: 36em; margin: 0 auto; padding: 22px 18px 90px;
  }
  h1 { font-size: 35px; line-height: 1.2; }
  #fc-main { padding-bottom: 80px; }
  #fc-refresh {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    font: 650 19px/1 -apple-system, system-ui, "Segoe UI", sans-serif;
    color: #ffffff; background: #0a4bc4;
    border: 2px solid #0a4bc4; border-radius: 14px; padding: 16px 24px;
    box-shadow: 0 3px 10px rgba(20, 18, 14, 0.22);
  }
  #fc-refresh:focus-visible { outline: 3px solid #14120e; outline-offset: 3px; }
</style>
</head>
<body>
<main id="fc-main"><h1 id="fc-status">Getting the page&hellip;</h1></main>
<button id="fc-refresh" type="button" aria-label="Refresh the page">Refresh</button>
<script>
var FN = "https://kwirafdwfffpbtycmctx.supabase.co/functions/v1/window";
var k = new URLSearchParams(location.search).get("k");
var main = document.getElementById("fc-main");

// Put the page back where it was. Anchoring to the SECTION rather than to a
// pixel offset is what makes this hold: the list above shrank by one item
// when the thing was marked done, so a raw scroll position would land you a
// row or two off. If the whole section went away — that was its last item —
// fall back to the old pixel position, clamped to the shorter page.
function restore(keep) {
  if (!keep) { window.scrollTo(0, 0); return; }
  var el = keep.id ? document.getElementById(keep.id) : null;
  if (el) {
    var y = el.getBoundingClientRect().top + window.pageYOffset - keep.offset;
    window.scrollTo(0, Math.max(0, y));
    return;
  }
  var max = Math.max(0, document.body.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.min(keep.y || 0, max));
}

// keep: optional {id, offset, y} recorded before a Mark done, so the page
// comes back to where you were reading instead of snapping to the top.
async function render(keep) {
  if (!k) { main.innerHTML = "<h1>This page needs its key. Check the bookmark.</h1>"; return; }
  try {
    var r = await fetch(FN + "?k=" + encodeURIComponent(k), { cache: "no-store" });
    var html = await r.text();
    if (!r.ok) { main.innerHTML = "<h1>The window said no. Check the key in the bookmark.</h1>"; return; }
    var doc = new DOMParser().parseFromString(html, "text/html");
    document.title = doc.title || "First Coffee";
    var old = document.getElementById("fc-style");
    if (old) old.remove();
    var style = doc.querySelector("style");
    if (style) {
      var adopted = document.importNode(style, true);
      adopted.id = "fc-style";
      document.head.appendChild(adopted);
    }
    var m = doc.querySelector("main");
    main.innerHTML = m ? m.innerHTML : doc.body.innerHTML;
    restore(keep);
  } catch (e) {
    main.innerHTML = "<h1>Couldn&rsquo;t reach the window. Tap Refresh to try again.</h1>";
  }
}

document.getElementById("fc-refresh").addEventListener("click", function () {
  var h = main.querySelector("h1");
  if (h) h.textContent = "Refreshing…";
  render();
});

// Picking a section closes the jump list, so the pinned bar goes back to
// one line and never sits on top of what you jumped to.
document.addEventListener("click", function (e) {
  var link = e.target && e.target.closest ? e.target.closest(".jump a") : null;
  if (!link) return;
  var panel = link.closest("details.jump");
  if (panel) setTimeout(function () { panel.open = false; }, 60);
});

// Saving a note: post the text, tell him it landed, then re-render so the
// note echoes back under its item. Same scroll-keeping as Mark done, because
// having the page jump after dictating a sentence is worse, not better.
document.addEventListener("submit", async function (e) {
  var f = e.target && e.target.closest ? e.target.closest("form.notef") : null;
  if (!f) return;
  e.preventDefault();
  var box = f.querySelector("textarea");
  var btn = f.querySelector("button");
  var text = (box && box.value || "").trim();
  if (!text) { if (box) box.focus(); return; }
  var sec = f.closest("section[id]");
  var keep = sec
    ? { id: sec.id, offset: sec.getBoundingClientRect().top, y: window.pageYOffset }
    : { id: null, offset: 0, y: window.pageYOffset };
  btn.disabled = true;
  btn.textContent = "Saving…";
  try {
    var r = await fetch(FN + "?note=1&o=" + encodeURIComponent(f.dataset.o)
      + "&t=" + encodeURIComponent(f.dataset.t) + "&k=" + encodeURIComponent(k), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ note: text }),
    });
    var j = await r.json();
    if (j.ok) { render(keep); }
    else { btn.disabled = false; btn.textContent = "Didn't save: " + (j.reason || "unknown"); }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Didn't send — tap again";
  }
});

document.addEventListener("click", async function (e) {
  var a = e.target && e.target.closest ? e.target.closest("a.done") : null;
  if (!a) return;
  e.preventDefault();
  var sec = a.closest("section[id]");
  var keep = sec
    ? { id: sec.id, offset: sec.getBoundingClientRect().top, y: window.pageYOffset }
    : { id: null, offset: 0, y: window.pageYOffset };
  a.textContent = "Marking…";
  try {
    var r = await fetch(a.href + "&ajax=1");
    var j = await r.json();
    if (j.ok) { render(keep); }
    else { a.textContent = "Failed: " + (j.reason || "unknown"); }
  } catch (err) {
    a.textContent = "Didn’t send — tap again";
  }
});

render();
</script>
</body>
</html>
